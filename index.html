<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КИЗ · Честный знак — дашборд</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EBE1;--bg2:#E8E1D4;--bg3:#FAF8F4;--card:#FFF;--border:rgba(160,148,128,.25);--border2:rgba(160,148,128,.45);--ink:#1A1610;--ink2:#6B6357;--ink3:#A09688;--green:#2D7A4F;--red:#B84040;--amber:#A06820;--blue:#005BFF;--hl:#FBF3D6;--hl2:#F4E9C4;--py:#7C6F55;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comfortaa',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.bname{font-size:15px;font-weight:700}.bsub{font-size:8px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;margin-left:14px}
.tab{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:0;color:var(--ink3);font-family:inherit;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg3)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:11px;color:var(--ink2);white-space:nowrap}
.b{padding:6px 11px;background:0;border:1px solid var(--border2);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;white-space:nowrap}
.b:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}.b:disabled{opacity:.4;cursor:default}
.b.pri{background:var(--ink);color:var(--bg3);border-color:var(--ink)}.b.pri:hover{opacity:.9}
.b.act{background:var(--amber);color:#fff;border-color:var(--amber)}
.b.gr{background:var(--green);color:#fff;border-color:var(--green)}.b.gr:hover{opacity:.9}
.main{padding:14px 16px;max-width:2000px;margin:0 auto}
.fbar{background:var(--card);border:1px solid var(--border2);border-radius:11px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.fitem{display:flex;align-items:center;gap:7px}
.fitem>label{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.sel{padding:5px 9px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0;cursor:pointer}
.sel:focus{border-color:var(--ink)}
.search{padding:5px 9px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0;min-width:220px}
.fspacer{margin-left:auto;font-size:10px;color:var(--ink3)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 15px}
.ml{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:6px}
.mv{font-size:23px;font-weight:700;line-height:1}.mv.g{color:var(--green)}.mv.r{color:var(--red)}.mv.a{color:var(--amber)}.mv.b{color:var(--blue)}
.md{font-size:11px;margin-top:5px;color:var(--ink3)}.md b{color:var(--ink2)}
.sec{margin-bottom:16px}
.sh{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;margin-bottom:9px;border-bottom:1px solid var(--border2);flex-wrap:wrap;gap:8px}
.st{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em}
.sm2{font-size:11px;color:var(--ink3)}
.sw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:right;padding:6px 8px;font-size:8.5px;font-weight:700;color:var(--ink3);background:var(--bg3);text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--border);font-family:inherit;white-space:nowrap;position:sticky;top:0;z-index:5;line-height:1.15}
thead th:first-child{text-align:left}
thead th.hl{background:var(--hl2)!important;color:var(--amber)!important}
.thsort{cursor:pointer;user-select:none}.thsort:hover{color:var(--ink)}
.arr{color:var(--ink);font-size:9px}
tbody td{padding:5px 8px;color:var(--ink);border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11.5px;position:relative}
tbody td:first-child{text-align:left;font-weight:700;color:var(--ink2)}
tbody tr:hover{background:var(--bg3)}
tbody td.hl{background:var(--hl)}
tbody tr.total td{font-weight:700;background:var(--bg2)!important;border-top:2px solid var(--border2);border-bottom:0}
tbody tr.empty td{color:var(--ink3);text-align:center;padding:22px}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar{position:absolute;top:2px;bottom:2px;right:2px;border-radius:3px;opacity:.24;z-index:0}
.bar.bl{background:var(--blue)}.bar.g{background:var(--green)}.bar.r{background:var(--red)}.bar.a{background:var(--amber)}
td span.v{position:relative;z-index:1}
.kiz{font-family:'Comfortaa',monospace;font-size:10.5px;letter-spacing:-.02em;color:var(--ink2)!important;font-weight:400!important}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.pill.s-sorted{background:rgba(0,91,255,.12);color:var(--blue)}
.pill.s-ready{background:rgba(160,104,32,.14);color:var(--amber)}
.pill.s-cancel{background:rgba(184,64,64,.12);color:var(--red)}
.pill.s-sold{background:rgba(45,122,79,.13);color:var(--green)}
.pill.s-wait{background:var(--bg);color:var(--ink3)}
.pill.s-deliv{background:rgba(10,125,107,.13);color:#0a7d6b}
.pill.s-ret{background:rgba(120,80,160,.15);color:#6b4a8a}
.pill.s-other{background:var(--bg);color:var(--ink3)}
.tagdone{font-size:8px;background:var(--green);color:#fff;padding:1px 6px;border-radius:4px;font-weight:700}
.tagnew{font-size:8px;background:var(--ink);color:var(--bg3);padding:1px 6px;border-radius:4px;font-weight:700}
.tagbad{font-size:8px;background:var(--red);color:#fff;padding:1px 6px;border-radius:4px;font-weight:700}
.diag{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:11px;color:var(--ink2);display:none}
.diag.show{display:block}
.diag table{width:auto}.diag td{border:0;padding:2px 16px 2px 0;text-align:left;white-space:nowrap;position:static}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.err{background:var(--red)}
.lm{padding:50px 24px;text-align:center;color:var(--ink3)}
.gate{max-width:360px;margin:56px auto;text-align:center}
.gate .gt{font-size:16px;font-weight:700;color:var(--ink)}
.gate .gs{font-size:12px;color:var(--ink3);margin:4px 0 18px}
.gate input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:9px;font-size:14px;font-family:inherit;outline:0}
.gate input:focus{border-color:var(--ink)}
.gate .err{color:var(--red);font-size:11px;margin-top:8px;min-height:14px}
.drop{max-width:520px;margin:26px auto;background:var(--card);border:1px dashed var(--border2);border-radius:14px;padding:30px 26px;text-align:center;transition:.15s}
.drop.over{border-color:var(--ink);background:var(--bg3)}
.drop .dt{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px}
.drop .ds{font-size:12px;color:var(--ink3);line-height:1.6;margin-bottom:16px}
.drop .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.note{max-width:100%;margin:12px 0 0;font-size:11px;color:var(--ink3);line-height:1.6;text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:11px 13px}
.note b{color:var(--ink2)}.note code{background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:10.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg3);padding:11px 18px;border-radius:10px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{display:none;position:fixed;inset:0;background:rgba(240,235,225,.95);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.ov.show{display:flex}
.oc{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:22px;width:600px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.oc h3{font-size:15px;margin-bottom:4px}.oc p{font-size:11px;color:var(--ink3);margin-bottom:12px}
.oc textarea{width:100%;height:200px;border:1px solid var(--border2);border-radius:9px;padding:10px;font-family:monospace;font-size:11px;resize:vertical;outline:0}
.oc textarea:focus{border-color:var(--ink)}
.oc .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media(max-width:900px){.mg{grid-template-columns:repeat(2,1fr)}.tabs{margin-left:6px}.bsub,.clock{display:none}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">КЗ</div>
  <div><div class="bname">КИЗ · возврат в оборот</div><div class="bsub">Wildberries FBS · Честный знак</div></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-p="over" onclick="tab('over')">Обзор</button>
    <button class="tab" data-p="out" onclick="tab('out')">Вывод из оборота</button>
    <button class="tab" data-p="ret" onclick="tab('ret')">Возврат в оборот</button>
    <button class="tab" data-p="reg" onclick="tab('reg')">Реестр</button>
  </div>
  <div class="hright">
    <div class="clock" id="clk"></div>
    <button class="b" onclick="toggleDiag()">◧ диагностика</button>
    <button class="b" id="offBtn" onclick="openOffline()" style="display:none">офлайн-файл</button>
    <button class="b pri" id="reloadBtn" onclick="reload()">↻ обновить</button>
  </div>
</div>

<div class="main">
  <div class="fbar" id="fbar" style="display:none">
    <div class="fitem"><label>ИП</label><select class="sel" id="fCo" onchange="render()"></select></div>
    <div class="fitem"><label>Поиск</label><input class="search" id="fSearch" placeholder="артикул или КИЗ…" oninput="render()"></div>
    <div class="fspacer" id="fInfo"></div>
  </div>

  <div id="page-over"></div>
  <div id="page-out"></div>
  <div id="page-ret"></div>
  <div id="page-reg"></div>

  <div id="placeholder" class="lm">Загрузка…</div>
</div>

<div class="ov" id="pasteOv">
  <div class="oc">
    <h3>Вставить данные (офлайн)</h3>
    <p>CSV/TSV с заголовком в первой строке, либо JSON-массив объектов.</p>
    <textarea id="pasteTa" placeholder="дата;orderId;ИП;статус;артикул;КИЗ;цена"></textarea>
    <div class="row"><button class="b" onclick="closePaste()">Отмена</button><button class="b pri" onclick="applyPaste()">Загрузить</button></div>
  </div>
</div>

<input type="file" id="fileInp" accept=".csv,.tsv,.txt,.json,.xlsx" style="display:none" onchange="onFile(event)">
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ═══════════ КОНФИГ ═══════════ */
const WORKER = 'https://kiz.ooo6311ooo.workers.dev';   /* твой адрес воркера; пусто = офлайн-режим */
const VERSION='2026-08-24b · даты дд.мм.гггг';  /* метка сборки — видна в диагностике */

/* ═══════════ STATE ═══════════ */
const LS_OUT='kiz_reg_out_v1', LS_RET='kiz_reg_ret_v1', TRIM=31;
const OUT_ST=['sorted','ready_for_pickup']; // ВЫВОД из оборота = отгружено на ПВЗ/СЦ
const RET_ST=['canceled_by_client'];   // ВОЗВРАТ в оборот = отказ клиента
const ACTION_ST=[...OUT_ST,...RET_ST];
let ROWS=[], curTab='over', SERVER=!!WORKER, SERVER_ACTIVE=!!WORKER, REG_OUT=new Set(), REG_RET=new Set(), COMPANIES=[];
let SRC='—', loadedAt=null, DIAG_SRV=[];
const SORT={};                          // tableId -> {key,dir}
let PENDING={};                         // tableId -> скачанный, но не подтверждённый батч

function getPass(){try{return sessionStorage.getItem('kiz_pass')||'';}catch(e){return '';}}
function setPass(p){try{sessionStorage.setItem('kiz_pass',p);}catch(e){}}
function loadRegLocal(){try{REG_OUT=new Set(JSON.parse(localStorage.getItem(LS_OUT)||'[]'));REG_RET=new Set(JSON.parse(localStorage.getItem(LS_RET)||'[]'));}catch(e){}}
function saveRegLocal(){try{localStorage.setItem(LS_OUT,JSON.stringify([...REG_OUT]));localStorage.setItem(LS_RET,JSON.stringify([...REG_RET]));}catch(e){}}

/* ═══════════ BOOT ═══════════ */
function boot(){
  document.getElementById('offBtn').style.display=SERVER?'inline-block':'none';
  if(SERVER){ if(getPass()) loadServer(); else askPassword(); }
  else { loadRegLocal(); showDrop(); }
}
function askPassword(msg){
  const ph=document.getElementById('placeholder'); ph.style.display='block';
  document.getElementById('fbar').style.display='none';
  ['over','out','ret','reg'].forEach(p=>document.getElementById('page-'+p).style.display='none');
  ph.innerHTML=`<div class="gate"><div class="gt">КИЗ · возврат в оборот</div>
    <div class="gs">${msg||'Введите пароль для доступа к данным'}</div>
    <input id="passInp" type="password" placeholder="пароль" onkeydown="if(event.key==='Enter')submitPass()">
    <div class="err" id="passErr"></div></div>`;
  setTimeout(()=>{const i=document.getElementById('passInp');if(i)i.focus();},50);
}
function submitPass(){const i=document.getElementById('passInp');if(i){setPass(i.value.trim());loadServer();}}

/* ═══════════ SERVER ═══════════ */
async function srv(qs,opts){return fetch(WORKER+qs,Object.assign({headers:{'X-Access-Key':getPass(),'Content-Type':'application/json'}},opts||{}));}
async function loadServer(refresh){
  const btn=document.getElementById('reloadBtn'); if(btn)btn.disabled=true;
  const ph=document.getElementById('placeholder'); ph.style.display='block'; ph.innerHTML='Загрузка данных из WB…';
  try{
    const r=await srv('?data=orders'+(refresh?'&refresh=1':''));
    if(r.status===401){setPass('');askPassword('Неверный пароль, попробуйте ещё раз');if(btn)btn.disabled=false;return;}
    if(!r.ok){throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));}
    const data=await r.json(); if(data.error) throw new Error(data.error);
    await loadRegistry(); SERVER_ACTIVE=true; ingestServer(data);
  }catch(e){
    ph.innerHTML=`<div class="gate"><div class="gt">Не удалось загрузить</div><div class="gs">${e.message}</div>
      <button class="b" onclick="loadServer(true)">Повторить</button>
      <button class="b" onclick="setPass('');askPassword()" style="margin-left:6px">Сменить пароль</button>
      <div style="margin-top:14px"><button class="b" onclick="openOffline()">Офлайн-режим</button></div></div>`;
  }
  if(btn)btn.disabled=false;
}
async function loadRegistry(){try{const r=await srv('?data=registry');if(r.ok){const j=await r.json();REG_OUT=new Set((j.out||[]).map(k=>String(k).slice(0,TRIM)));REG_RET=new Set((j.ret||[]).map(k=>String(k).slice(0,TRIM)));}}catch(e){}}
function ingestServer(data){
  COMPANIES=data.companies||[];
  ROWS=(data.rows||[]).map(mapRow);PENDING={};
  SRC='WB API · окно '+(data.window||90)+' дн.'; loadedAt=data.builtAt?new Date(data.builtAt):new Date(); DIAG_SRV=data.diag||[];
  document.getElementById('placeholder').style.display='none';
  buildFilters(COMPANIES);
  document.getElementById('fbar').style.display='flex';
  toast(`Загружено ${ROWS.length} строк из WB`);
  render(); renderDiag();
}

/* ═══════════ OFFLINE ═══════════ */
function showDrop(){
  const ph=document.getElementById('placeholder'); ph.style.display='block';
  ph.innerHTML=`<div class="drop" id="drop"><div class="dt">Офлайн-режим</div>
    <div class="ds">Перетащите файл выгрузки (.csv/.xlsx/.json) или вставьте данные.</div>
    <div class="row"><button class="b pri" onclick="pickFile()">Выбрать файл</button>
      <button class="b" onclick="openPaste()">Вставить</button>
      <button class="b" onclick="loadDemo()">Демо-данные</button></div></div>`;
  bindDrop();
}
function openOffline(){SERVER_ACTIVE=false;showDrop();}

/* ═══════════ PARSERS (офлайн) ═══════════ */
const ALIAS={date:['дата','date','createdat','created'],id:['orderid','id','номер заказа','заказ','order'],
  co:['ип','компания','company','co','юрлицо','поставщик'],status:['статус','status','wbstatus'],
  art:['артикул','article','artikul','vendorcode','sku','код'],predmet:['предмет','subject','категория','category'],
  kiz:['киз','sgtin','маркировка','код маркировки','datamatrix'],price:['цена','price','finalprice','стоимость','сумма']};
function keyOf(h){const s=String(h||'').trim().toLowerCase();for(const k in ALIAS)if(ALIAS[k].includes(s))return k;return null;}
function detectDelim(l){const c=(l.match(/,/g)||[]).length,sc=(l.match(/;/g)||[]).length,t=(l.match(/\t/g)||[]).length;if(t>=sc&&t>=c)return '\t';if(sc>=c)return ';';return ',';}
function splitLine(line,d){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch==='"')q=true;else if(ch===d){o.push(c);c='';}else c+=ch;}}o.push(c);return o;}
function parseCSV(text){text=text.replace(/^\uFEFF/,'').replace(/\r/g,'');const L=text.split('\n').filter(l=>l.trim()!=='');if(!L.length)return [];const d=detectDelim(L[0]);const H=splitLine(L[0],d).map(keyOf);const rows=[];for(let i=1;i<L.length;i++){const cs=splitLine(L[i],d);const o={};H.forEach((k,j)=>{if(k)o[k]=(cs[j]||'').trim();});rows.push(o);}return rows;}
function parseJSON(t){const a=JSON.parse(t);if(!Array.isArray(a))throw new Error('Ожидался массив');return a.map(r=>{const o={};for(const k in r){const kk=keyOf(k);if(kk)o[kk]=r[k];}return o;});}

/* ═══════════ NORMALIZE ═══════════ */
function coercePrice(v){if(v==null||v==='')return 0;let s=String(v).replace(/\s/g,'').replace(/₽|руб\.?/gi,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0;}
function parseDate(v){if(!v)return null;const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return {y:+m[1],mo:+m[2]};m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);if(m)return {y:+m[3],mo:+m[2]};const d=new Date(s);if(!isNaN(d))return {y:d.getFullYear(),mo:d.getMonth()+1};return null;}
function mapRow(r){const kizRaw=String(r.kiz||'').trim();const dt=parseDate(r.date);const dstr=String(r.date||'').slice(0,10);return {date:dstr,y:dt?dt.y:0,mo:dt?dt.mo:0,id:String(r.id||'').trim(),co:String(r.co||'—').trim()||'—',status:String(r.status||'').trim(),art:String(r.art||r.article||'').trim(),kizFull:kizRaw,kiz:kizRaw.slice(0,TRIM),price:coercePrice(r.price)};}
function normalize(raw){return raw.map(mapRow);}

/* ═══════════ FILE / PASTE ═══════════ */
function pickFile(){document.getElementById('fileInp').click();}
function onFile(e){const f=e.target.files[0];if(f)readFile(f);e.target.value='';}
function readFile(f){const name=f.name.toLowerCase();const rd=new FileReader();
  if(name.endsWith('.xlsx')){rd.onload=ev=>{try{if(typeof XLSX==='undefined')throw new Error('XLSX не загрузился');const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});const csv=aoa.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');ingest(parseCSV(csv),f.name);}catch(err){toast('Ошибка XLSX: '+err.message);}};rd.readAsArrayBuffer(f);}
  else{rd.onload=ev=>{const t=ev.target.result;try{ingest(name.endsWith('.json')?parseJSON(t):parseCSV(t),f.name);}catch(err){toast('Ошибка: '+err.message);}};rd.readAsText(f,'utf-8');}}
function openPaste(){document.getElementById('pasteOv').classList.add('show');setTimeout(()=>document.getElementById('pasteTa').focus(),40);}
function closePaste(){document.getElementById('pasteOv').classList.remove('show');}
function applyPaste(){const t=document.getElementById('pasteTa').value.trim();if(!t){closePaste();return;}try{ingest(t[0]==='['?parseJSON(t):parseCSV(t),'вставка');closePaste();}catch(err){toast('Не разобрал: '+err.message);}}
function ingest(raw,src){const rows=normalize(raw);if(!rows.length){toast('Строк не найдено');return;}
  ROWS=rows;SRC=src;loadedAt=new Date();SERVER_ACTIVE=false;loadRegLocal();DIAG_SRV=[];PENDING={};
  COMPANIES=[...new Set(ROWS.map(r=>r.co))].filter(c=>c&&c!=='—').sort();
  document.getElementById('placeholder').style.display='none';buildFilters(COMPANIES);
  document.getElementById('fbar').style.display='flex';toast(`Загружено ${rows.length} строк · ${src}`);render();renderDiag();}

/* ═══════════ RELOAD / FILTERS ═══════════ */
function reload(){ if(SERVER&&SERVER_ACTIVE) loadServer(true); else if(ROWS.length) render(); else boot(); }
function buildFilters(cos){const list=['ВСЕ',...(cos||[]).filter(Boolean)];
  document.getElementById('fCo').innerHTML=list.map(c=>`<option value="${c}">${c==='ВСЕ'?'Все ИП':c}</option>`).join('');}
function curCoVal(){return document.getElementById('fCo').value;}
function filtered(statuses){const co=curCoVal();const q=document.getElementById('fSearch').value.trim().toLowerCase();
  return ROWS.filter(r=>{if(statuses&&!statuses.includes(r.status))return false;if(co!=='ВСЕ'&&r.co!==co)return false;if(q&&!(r.art.toLowerCase().includes(q)||r.kizFull.toLowerCase().includes(q)))return false;return true;});}

/* ═══════════ HELPERS ═══════════ */
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function fmtDate(d){const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:(d?String(d).slice(0,10):'—');}
function fmt2(n){return n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});}
const PILL={sold:['s-sold','выкуплен'],canceled_by_client:['s-cancel','отказ клиента'],canceled:['s-cancel','отменён'],
  declined_by_client:['s-cancel','отказ (1 час)'],sorted:['s-sorted','отсортирован'],ready_for_pickup:['s-ready','готов к выдаче'],
  waiting:['s-wait','ожидает'],delivered:['s-deliv','доставлен'],returned:['s-ret','возврат покупателя'],defect:['s-wait','брак']};
function pillOf(s){const[c,t]=PILL[s]||['s-other',s||'—'];return `<span class="pill ${c}" title="статус WB: ${s}">${t}</span>`;}
function exportable(rows,reg){const seen=new Set();return rows.filter(r=>{if(!r.kiz)return false;if(r.price<=0)return false;if(reg.has(r.kiz))return false;if(seen.has(r.kiz))return false;seen.add(r.kiz);return true;});}
function stateOf(r,reg){return !r.kiz?'нет КИЗ':r.price<=0?'цена 0':reg.has(r.kiz)?'в реестре':'к выгрузке';}
function stateTag(r,reg){const m={'нет КИЗ':'tagbad','цена 0':'tagbad','в реестре':'tagdone','к выгрузке':'tagnew'};const s=stateOf(r,reg);return `<span class="${m[s]}">${s}</span>`;}
function stateOrder(r,reg){return {'к выгрузке':0,'в реестре':1,'цена 0':2,'нет КИЗ':3}[stateOf(r,reg)];}

/* ═══════════ SORTABLE TABLE ═══════════ */
function sortBy(tid,key){const s=SORT[tid]||{key:null,dir:1};if(s.key===key)s.dir=-s.dir;else{s.key=key;s.dir=1;}SORT[tid]=s;render();}
function th(col,tid){const s=SORT[tid]||{};const arrow=s.key===col.key?`<span class="arr">${s.dir<0?'▾':'▴'}</span>`:'';
  const al=col.align==='right'?'':'style="text-align:left"';
  return `<th ${al} class="thsort ${col.hl?'hl':''}" title="${(col.tip||'').replace(/"/g,'&quot;')}" onclick="sortBy('${tid}','${col.key}')">${col.label} ${arrow}</th>`;}
function applySort(tid,rows,cols){const s=SORT[tid];if(!s||!s.key)return rows;const col=cols.find(c=>c.key===s.key);const val=(col&&col.sortVal)?col.sortVal:(r=>r[s.key]);
  return [...rows].sort((a,b)=>{let x=val(a),y=val(b);if(typeof x==='string')x=x.toLowerCase();if(typeof y==='string')y=y.toLowerCase();if(x<y)return -s.dir;if(x>y)return s.dir;return 0;});}
function tableHTML(tid,cols,rows,footer){const sorted=applySort(tid,rows,cols);
  const head=cols.map(c=>th(c,tid)).join('');
  const body=sorted.length?sorted.map(r=>'<tr>'+cols.map(c=>{const al=c.align==='right'?'':'style="text-align:left"';return `<td ${al} class="${c.hl?'hl':''}">${c.cell?c.cell(r):(r[c.key]??'')}</td>`;}).join('')+'</tr>').join(''):`<tr class="empty"><td colspan="${cols.length}">Пусто под фильтром</td></tr>`;
  return `<div class="sw"><table><thead><tr>${head}</tr></thead><tbody>${body}${footer||''}</tbody></table></div>`;}

/* ═══════════ RENDER ═══════════ */
function tab(name){curTab=name;document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.p===name));
  ['over','out','ret','reg'].forEach(p=>document.getElementById('page-'+p).style.display=p===name?'block':'none');
  document.getElementById('fbar').style.display=(ROWS.length&&name!=='reg')?'flex':'none';render();}
function render(){if(!ROWS.length)return;
  if(curTab==='over')renderOver();
  else if(curTab==='out')renderFlow('out','page-out','Заказы к выводу КИЗ из оборота',OUT_ST,'вывести из оборота при отгрузке на ПВЗ/СЦ');
  else if(curTab==='ret')renderFlow('ret','page-ret','Заказы к возврату КИЗ в оборот',RET_ST,'вернуть в оборот (отказ клиента)');
  else if(curTab==='reg')renderReg();
  const fi=document.getElementById('fInfo');if(fi)fi.textContent=`источник: ${SRC} · ${ROWS.length} строк`;}
function kpi(l,v,c,s){return `<div class="mc"><div class="ml">${l}</div><div class="mv ${c||''}">${v}</div><div class="md">${s||''}</div></div>`;}

function renderOver(){
  const out=filtered(OUT_ST),ret=filtered(RET_ST);
  const all=filtered(null);
  const bad=filtered(ACTION_ST).filter(r=>!r.kiz||r.price<=0).length;
  const kpis=[
    kpi('Всего заказов',fmt(all.length),'',`${fmt(all.reduce((s,r)=>s+r.price,0))} ₽ · во всех статусах`),
    kpi('К выводу из оборота',fmt(out.length),'b',`${fmt(out.reduce((s,r)=>s+r.price,0))} ₽ · отгружено на ПВЗ/СЦ`),
    kpi('К возврату в оборот',fmt(ret.length),'r',`${fmt(ret.reduce((s,r)=>s+r.price,0))} ₽ · отказы клиента`),

  // разбивка по всем статусам
  const m={};filtered(null).forEach(r=>{const k=r.status||'—';m[k]=m[k]||{status:k,n:0,sum:0};m[k].n++;m[k].sum+=r.price;});

  const cols=[
    {key:'status',label:'Статус',align:'left',tip:'wbStatus из WB API — статус заказа на стороне Wildberries',cell:r=>pillOf(r.status)},
    {key:'n',label:'Заказов',align:'right',tip:'Число заказов с этим статусом (после фильтра ИП/поиск)',cell:r=>`<span class="bar bl" style="width:${r.n/maxN*100}%"></span><span class="v">${fmt(r.n)}</span>`},
    {key:'sum',label:'Сумма',align:'right',tip:'Сумма цен заказов (finalPrice из WB), рубли',cell:r=>fmt(r.sum)+' ₽'}];
  if(!SORT['over'])SORT['over']={key:'n',dir:-1};
  const allCols=[
    {key:'date',label:'Дата',align:'left',tip:'Дата создания заказа (createdAt в WB API)',cell:r=>fmtDate(r.date),sortVal:r=>r.date},
    {key:'co',label:'ИП',align:'left',tip:'Кабинет-продавец (какой токен WB отдал заказ)'},
    {key:'status',label:'Статус',align:'left',tip:'wbStatus из WB API',cell:r=>pillOf(r.status),sortVal:r=>r.status},
    {key:'art',label:'Артикул',align:'left',tip:'Артикул продавца (article в WB API)'},
    {key:'kiz',label:'КИЗ (31)',align:'left',tip:'Код маркировки Честного знака (sgtin), 31 символ',cell:r=>`<span class="kiz">${r.kiz||'—'}</span>`,sortVal:r=>r.kiz},
    {key:'price',label:'Цена',align:'right',tip:'Цена заказа (finalPrice из WB), рубли',cell:r=>r.price?fmt2(r.price)+' ₽':'<span class="neg">0</span>',sortVal:r=>r.price}];
  if(!SORT['all'])SORT['all']={key:'date',dir:-1};
  document.getElementById('page-over').innerHTML=`<div class="mg">${kpis}</div>
    <div class="sec"><div class="sh"><div class="st">Заказы по статусам</div><div class="sm2">фильтр: ${curCoVal()==='ВСЕ'?'все ИП':curCoVal()}</div></div>
    ${tableHTML('over',cols,arr)}</div>
    <div class="note"><b>Логика.</b> «Вывод из оборота» = отгруженные заказы (<code>sorted</code>, <code>ready_for_pickup</code>). «Возврат в оборот» = отказы клиента (<code>canceled_by_client</code>). Работа в два шага: <b>«Скачать для ЧЗ»</b> — Excel-файл с двумя столбцами (КИЗ 31 символ и Цена; цена 0 и уже выгруженные исключены), список при этом <b>не тает</b>. После реальной загрузки файла в Честный знак жмёшь <b>«Отметить выгруженными»</b> — вот тогда КИЗ уходят в общий реестр ${SERVER_ACTIVE?'(лист «Выгружено», виден всем)':'(локально)'} и пропадают из списка. Реестры «Выведено» и «Возвращено» <b>раздельные</b> — один КИЗ может пройти оба этапа. Так ничего не потеряется, если файл скачали, но в ЧЗ не залили. Наведи на заголовок — подсказка; клик — сортировка.</div>
    <div class="sec"><div class="sh"><div class="st">Все заказы</div><div class="sm2">${all.length} строк · клик по заголовку — сортировка, поиск и ИП — сверху</div></div>

}

function renderFlow(tid,pageId,title,statuses,action){
  const reg=tid==='out'?REG_OUT:REG_RET;
  const rows=filtered(statuses);
  const exp=exportable(rows,reg);const sumExp=exp.reduce((s,r)=>s+r.price,0);
  const inReg=rows.filter(r=>r.kiz&&reg.has(r.kiz)).length;
  const noKiz=rows.filter(r=>!r.kiz).length,zero=rows.filter(r=>r.kiz&&r.price<=0).length;
  const kpis=[kpi('Заказов',fmt(rows.length),'',statuses.join(', ')),kpi('КИЗ к выгрузке',fmt(exp.length),'g',`${fmt(sumExp)} ₽`),
    kpi('Уже в реестре',fmt(inReg),'',inReg?'исключены':'—'),kpi('Проблемные',fmt(noKiz+zero),(noKiz+zero)?'a':'',(noKiz+zero)?`нет КИЗ: ${noKiz} · цена 0: ${zero}`:'—')].join('');
  const cols=[
    {key:'date',label:'Дата',align:'left',tip:'Дата создания заказа (createdAt в WB API)',cell:r=>fmtDate(r.date),sortVal:r=>r.date},
    {key:'co',label:'ИП',align:'left',tip:'Кабинет-продавец (какой токен WB отдал заказ)'},
    {key:'status',label:'Статус',align:'left',tip:'wbStatus из WB API',cell:r=>pillOf(r.status),sortVal:r=>r.status},
    {key:'art',label:'Артикул',align:'left',tip:'Артикул продавца (article в WB API)'},
    {key:'kiz',label:'КИЗ (31)',align:'left',tip:'Код маркировки Честного знака (sgtin), обрезан до 31 символа — то, что уходит в файл',cell:r=>`<span class="kiz">${r.kiz||'—'}</span>`,sortVal:r=>r.kiz},
    {key:'price',label:'Цена',align:'right',tip:'Цена заказа (finalPrice из WB, копейки → рубли ÷100)',cell:r=>r.price?fmt2(r.price)+' ₽':'<span class="neg">0</span>',sortVal:r=>r.price},
    {key:'state',label:'Состояние',align:'left',tip:'к выгрузке / в реестре (уже выгружен) / нет КИЗ / цена 0',cell:r=>stateTag(r,reg),sortVal:r=>stateOrder(r,reg)}];
  if(!SORT[tid])SORT[tid]={key:'date',dir:-1};
  const pend=PENDING[tid];
  const pendHTML=pend?`<div class="note" style="border-color:var(--amber);background:var(--hl);margin:0 0 10px">
      Скачан файл на <b>${pend.n} КИЗ</b> (${fmt(pend.sum)} ₽). Загрузи его в Честный знак, затем подтверди:
      <button class="b gr" style="padding:4px 9px;margin-left:6px" onclick="confirmBatch('${tid}')">✓ Отметить выгруженными</button>
      <button class="b" style="padding:4px 9px" onclick="cancelBatch('${tid}')">Отмена</button>
      <br><span style="color:var(--ink3)">Пока не подтвердишь — эти КИЗ остаются в списке и не пропадут.</span></div>`:'';
  document.getElementById(pageId).innerHTML=`<div class="mg">${kpis}</div>
    <div class="sec"><div class="sh"><div class="st">${title}</div>
      <div style="display:flex;gap:8px;align-items:center"><span class="sm2">${exp.length} КИЗ · ${fmt(sumExp)} ₽ к выгрузке</span>
      <button class="b gr" onclick="exportChZ('${statuses.join(',')}','${tid}')" ${exp.length?'':'disabled'}>↧ Скачать для ЧЗ</button></div></div>
    ${pendHTML}
    <div class="sm2" style="margin:-4px 0 8px">Строки — ${action}. Наведи на заголовок для пояснения, клик — сортировка.</div>
    ${tableHTML(tid,cols,rows)}</div>`;
}

function renderReg(){
  const outArr=[...REG_OUT].map((kiz,i)=>({i:i+1,kiz}));
  const retArr=[...REG_RET].map((kiz,i)=>({i:i+1,kiz}));
  const cols=tip=>[{key:'i',label:'№',align:'left',tip:'Порядковый номер'},{key:'kiz',label:'КИЗ (31 символ)',align:'left',tip:tip,cell:r=>`<span class="kiz">${r.kiz}</span>`}];
  document.getElementById('page-reg').innerHTML=`<div class="mg">
    ${kpi('Выведено из оборота',fmt(outArr.length),'b','лист «Выведено»')}

    ${kpi('Хранилище',SERVER_ACTIVE?'сервер':'браузер','',SERVER_ACTIVE?'общий · Google-таблица':'localStorage')}

    <div class="note" style="margin:0 0 12px">Реестры <b>раздельные</b>: один КИЗ может быть в обоих (вывели на отгрузке → вернули после отказа). ${SERVER_ACTIVE?'Общие: листы «Выведено»/«Возвращено» в Google-таблице, видны всем.':'Внимание: офлайн — локально в этом браузере.'}</div>
    <div class="sec"><div class="sh"><div class="st">Выведено из оборота</div>
      <div style="display:flex;gap:8px"><button class="b" onclick="exportReg('out')" ${outArr.length?'':'disabled'}>↧ Скачать</button><button class="b act" onclick="clearReg('out')" ${outArr.length?'':'disabled'}>Очистить</button></div></div>
      ${tableHTML('regOut',cols('Выведенный из оборота КИЗ'),outArr)}</div>
    <div class="sec"><div class="sh"><div class="st">Возвращено в оборот</div>
      <div style="display:flex;gap:8px"><button class="b" onclick="exportReg('ret')" ${retArr.length?'':'disabled'}>↧ Скачать</button><button class="b act" onclick="clearReg('ret')" ${retArr.length?'':'disabled'}>Очистить</button></div></div>
      ${tableHTML('regRet',cols('Возвращённый в оборот КИЗ'),retArr)}</div>`;

/* ═══════════ EXPORT ═══════════ */
function download(name,text){const b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportChZ(statusesStr,tid){
  const reg=tid==='out'?REG_OUT:REG_RET;
  const statuses=statusesStr.split(',');const exp=exportable(filtered(statuses),reg);
  if(!exp.length){toast('Нет новых КИЗ к выгрузке');return;}
  const kind=statuses.includes('canceled_by_client')?'возврат':'вывод';
  writeExport(`ЧЗ_${kind}_${new Date().toISOString().slice(0,10)}`,exp);
  PENDING[tid]={kiz:exp.map(r=>r.kiz),n:exp.length,sum:exp.reduce((s,r)=>s+r.price,0)};
  toast(`Скачано ${exp.length} КИЗ. Файл НЕ помечен — подтверди после загрузки в ЧЗ.`);
  render();
}
// КИЗ содержит спецсимволы (; , и др.) -> отдаём xlsx, где КИЗ = текст в одной ячейке
function writeExport(fname,exp){
  if(typeof XLSX!=='undefined'){
    const aoa=[['КИЗ','Цена'],...exp.map(r=>[String(r.kiz),r.price])];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:36},{wch:12}];
    for(let i=2;i<=aoa.length;i++){const c=ws['A'+i];if(c){c.t='s';c.z='@';}}   // КИЗ строго текст
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'КИЗ');
    XLSX.writeFile(wb,fname+'.xlsx');
  }else{  // запасной CSV с кавычками, чтобы ; внутри КИЗ не рвал столбцы
    const csv=['"КИЗ";"Цена"',...exp.map(r=>`"${String(r.kiz).replace(/"/g,'""')}";${String(r.price).replace('.',',')}`)].join('\n');
    download(fname+'.csv',csv);
  }
}
async function confirmBatch(tid){
  const b=PENDING[tid]; if(!b) return;
  const kizList=b.kiz, kind=tid==='out'?'out':'ret', reg=tid==='out'?REG_OUT:REG_RET;
  if(SERVER_ACTIVE){try{const r=await srv('?action=markExported',{method:'POST',body:JSON.stringify({kiz:kizList,kind})});
    if(r.ok){await loadRegistry();toast(`Отмечено выгруженными: ${kizList.length}`);}else{toast('Не удалось отметить (HTTP '+r.status+')');return;}}
    catch(e){toast('Ошибка: '+e.message);return;}}
  else{kizList.forEach(k=>reg.add(k));saveRegLocal();toast(`Отмечено выгруженными: ${kizList.length}`);}
  delete PENDING[tid]; render(); renderDiag();
}
function cancelBatch(tid){delete PENDING[tid];toast('Батч сброшен, ничего не отмечено');render();}
function exportReg(kind){const reg=kind==='ret'?REG_RET:REG_OUT;const nm=kind==='ret'?'возвращено':'выведено';download(`реестр_${nm}_${new Date().toISOString().slice(0,10)}.csv`,['КИЗ',...reg].join('\n'));}
async function clearReg(kind){const nm=kind==='ret'?'«Возвращено»':'«Выведено»';if(!confirm('Очистить реестр '+nm+'? Отменить нельзя.'))return;
  if(SERVER_ACTIVE){try{const r=await srv('?action=clearRegistry',{method:'POST',body:JSON.stringify({kind})});if(r.ok){if(kind==='ret')REG_RET=new Set();else REG_OUT=new Set();toast('Реестр очищен (сервер)');}}catch(e){toast('Ошибка: '+e.message);}}
  else{if(kind==='ret')REG_RET=new Set();else REG_OUT=new Set();saveRegLocal();toast('Реестр очищен');}
  render();renderDiag();}

/* ═══════════ DIAGNOSTICS ═══════════ */
let diagShown=false;
function toggleDiag(){diagShown=!diagShown;renderDiag();}
function renderDiag(){let d=document.getElementById('diagPanel');
  if(!d){d=document.createElement('div');d.id='diagPanel';d.className='diag';document.querySelector('.main').insertBefore(d,document.getElementById('page-over'));}
  d.classList.toggle('show',diagShown&&ROWS.length>0);if(!diagShown||!ROWS.length)return;
  const out=ROWS.filter(r=>OUT_ST.includes(r.status)),ret=ROWS.filter(r=>RET_ST.includes(r.status));
  const noKiz=ROWS.filter(r=>ACTION_ST.includes(r.status)&&!r.kiz).length;
  const zero=ROWS.filter(r=>ACTION_ST.includes(r.status)&&r.kiz&&r.price<=0).length;
  const kizAll=ROWS.filter(r=>r.kiz).map(r=>r.kiz);const dup=kizAll.length-new Set(kizAll).size;
  const line=(st,name,val,msg)=>`<tr><td><span class="dot ${st}"></span>${name}</td><td>${val}</td><td style="color:var(--ink3)">${msg||''}</td></tr>`;
  const srvLines=DIAG_SRV.map(x=>line(x.status||'ok',(x.co?x.co+' · ':'')+x.name,x.rows,x.msg||'')).join('');
  d.innerHTML=`<b>Диагностика</b> <span style="color:var(--ink3)">· ${loadedAt?loadedAt.toLocaleString('ru-RU'):'—'} · ${SRC} · режим: ${SERVER_ACTIVE?'сервер':'офлайн'} · сборка: ${VERSION}</span>
    <table style="margin-top:6px">
    ${line('ok','Всего строк',ROWS.length,'все статусы')}
    ${line('ok','Вывод (sold)',out.length,'')}
    ${line('ok','Возврат (canceled_by_client)',ret.length,'')}
    ${line(noKiz?'warn':'ok','Без КИЗ (в действиях)',noKiz,noKiz?'не попадут в выгрузку':'')}
    ${line(zero?'warn':'ok','Цена 0 (в действиях)',zero,zero?'исключены':'')}
    ${line(dup?'warn':'ok','Дубли КИЗ',dup,dup?'берётся один раз':'')}
    ${line('ok','Реестр «Выведено»',REG_OUT.size,SERVER_ACTIVE?'общий':'локальный')}
    ${line('ok','Реестр «Возвращено»',REG_RET.size,SERVER_ACTIVE?'общий':'локальный')}
    ${srvLines}</table>`;
}

/* ═══════════ DEMO ═══════════ */
function loadDemo(){const arts=['Pantal.VV.bej.01','Pantal.SK.glad.bej','Pantal.AN.Bej.01','sock-black-40','cap-beige'];const cos=['ИП1','ИП1','ИП2'];
  const sts=['sold','sold','canceled_by_client','sorted','ready_for_pickup','waiting','delivered','returned'];const rows=[];let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=0;i<60;i++){const art=arts[Math.floor(rnd()*arts.length)];const st=sts[Math.floor(rnd()*sts.length)];const mo=6+Math.floor(rnd()*3);const day=String(1+Math.floor(rnd()*27)).padStart(2,'0');const gtin=String(4607177590000+Math.floor(rnd()*99999)).slice(0,13);const serial=Math.random().toString(36).slice(2,15).padEnd(13,'0');let kiz='01'+('0'+gtin).slice(0,14)+'21'+serial;let price=[290,590,730,890,1023,1990][Math.floor(rnd()*6)];if(rnd()<0.05)price=0;if(rnd()<0.04)kiz='';if(rnd()<0.04&&rows.length)kiz=rows[rows.length-1].kiz;rows.push({date:`2026-${String(mo).padStart(2,'0')}-${day}`,orderid:13800000+i,ип:cos[Math.floor(rnd()*cos.length)],статус:st,артикул:art,киз:kiz,цена:price});}
  ingest(rows,'демо-данные');}

let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function bindDrop(){const drop=document.getElementById('drop');if(!drop)return;['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();if(e==='drop'&&ev.dataTransfer.files[0])readFile(ev.dataTransfer.files[0]);if(e!=='dragover')drop.classList.remove('over');}));}
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});},1000);
document.getElementById('clk').textContent=new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
